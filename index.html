<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet"> 
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
     body {
      background-color: hsl(212, 45%, 89%);
      
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction:column;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;

      font-family: 'Outfit', sans-serif;
    }

    .card{
      background-color: white;

      width: 100%;
      max-width: 320px;

      padding: 16px;
      border-radius: 20px;

      box-sizing: border-box;
    }

    .card-image{
      width: 100%;
      border-radius: 10px;
    }
    
    .card-title{
      font-size:22px;
      text-align:center;
      color: hsl(218, 44%, 22%);
      margin-top: 24px;
      margin-bottom: 16px;
    }

    .card-text{
      font-size: 15px;
      text-align:center;
      color: hsl(216, 15%, 48%);  
    }

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    
  </style>
</head>
<body>
   <main class = "card">
      <img class = "card-image" 
           src = "./images/image-qr-code.png" 
           alt = "QR code">
      <h1 class = "card-title">Improve your front-end skills by building projects</h1>
      <p class = "card-text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Snz</a>.
  </footer>
</body>
</html>
